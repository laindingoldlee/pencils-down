<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Night</title>
<meta name="description" content="Party games to play live with friends in the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235B3FD6'/%3E%3Ctext x='16' y='23' font-family='Arial Black,Arial' font-weight='900' font-size='19' text-anchor='middle' fill='%23FFD84A'%3EG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{
  --bg:#F1EEF8; --panel:#FFFFFF; --ink:#221A4D; --ink-soft:#615A8F; --line:#E3DDF2; --line-strong:#B9B0DC;
  --brand:#5B3FD6; --on-brand:#FFFFFF; --mark:#FFD84A; --mark-deep:#E2B624; --on-mark:#221A4D;
  --danger:#D3312A; --good:#16805A; --hilite:#F6F1FF; --focus:#2F49D1; --scrim:rgba(20,16,60,.55);
  --shadow:0 1px 0 rgba(34,26,77,.05), 0 10px 26px -14px rgba(34,26,77,.32);
  /* The game table stays dark in both themes so every item color shows up, white included. */
  --felt:#18133C; --felt-2:#2A2163; --felt-ink:#F4F0FF; --felt-soft:#B3AAE4; --gold:#E9C35B; --card-face:#0F0C2A;
  --font-display:"Bungee","Arial Black",Impact,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E0B24; --panel:#18143A; --ink:#ECE8FF; --ink-soft:#A9A2D8; --line:#2A2459; --line-strong:#4A4290;
    --brand:#8F78FF; --on-brand:#120E30; --mark-deep:#D5A91A; --danger:#EF5A50; --good:#46C68E; --hilite:#221D4D;
    --focus:#A9B8FF; --scrim:rgba(4,3,16,.72);
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 12px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
body.inroom{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--ink-soft)}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:700}

.shell{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:10px 32px}
.bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:6px 14px}
.brand{font-family:var(--font-display);font-size:1.25rem;line-height:1;display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.roomchip{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.roomchip b{font-family:var(--font-display);letter-spacing:.1em;font-weight:400}
.notice{border:1.5px solid var(--line-strong);background:var(--panel);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.panel-head{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:1.15rem}
.pad{padding:16px 20px}

.btn{font-weight:700;border-radius:9px;padding:10px 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.big{padding:13px 22px;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):active{transform:translateY(1px)}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.linkbtn.armed{color:var(--danger);font-weight:700}

/* home */
.hero{padding:30px 22px 8px;display:grid;gap:10px}
.hero h1{font-family:var(--font-display);font-size:clamp(2rem,7vw,3.4rem);line-height:1}
.hero p{margin:0;max-width:56ch;font-size:1.05rem}
.homeforms{display:grid;gap:14px;padding:16px 22px 24px}
.field{display:grid;gap:6px;max-width:440px}
.field label{font-weight:700}
.field input,.coderow input{min-width:0;border:1.5px solid var(--line-strong);border-radius:9px;padding:11px 12px;background:var(--panel);font-size:1.05rem}
.choices{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.or{color:var(--ink-soft);font-size:.9rem}
.coderow{display:flex;gap:8px;align-items:center}
.coderow input{width:7.2em;font-family:var(--font-display);letter-spacing:.12em;text-transform:uppercase}
.formerror{color:var(--danger);font-weight:700;margin:0;min-height:1.4em}
.gcard.soon{border-style:dashed;opacity:.7}
.howto h2{font-size:1.15rem;margin-bottom:8px}
.howto ol{margin:0;padding-left:1.3em;display:grid;gap:6px;max-width:68ch}

/* avatars */
.av{--hue:260;width:var(--s,52px);height:var(--s,52px);border-radius:50%;display:grid;place-items:center;flex:none;position:relative;
  background:hsl(var(--hue) 70% 58%);color:#fff;font-family:var(--font-display);font-size:calc(var(--s,52px)*.42);line-height:1;
  box-shadow:inset 0 -4px 0 hsl(var(--hue) 60% 42%);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.av.off{filter:grayscale(1);opacity:.5}
.av .crown{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:15px;text-shadow:none}
.crowd{list-style:none;margin:0;padding:18px 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:18px 10px}
.crowd li{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.crowd .nm{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crowd .sub{font-size:.78rem;color:var(--ink-soft);margin-top:-4px}

/* invite */
.invite{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--font-display);font-size:2rem;letter-spacing:.12em;line-height:1.1}
.linkline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 20px 16px}
.linkline code{font-size:.95rem;background:var(--hilite);padding:6px 10px;border-radius:6px;overflow-wrap:anywhere;min-width:0;user-select:all}

/* game picker */
.banner{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:14px 20px;background:var(--hilite);border-bottom:1px solid var(--line)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px 20px}
.gcard{text-align:left;border:2px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 16px;display:grid;gap:6px;align-content:start;position:relative}
.gcard h3{font-family:var(--font-display);font-size:1.05rem;font-weight:400;line-height:1.15}
.gcard p{margin:0;font-size:.92rem;color:var(--ink-soft)}
.gcard .tag{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft)}
.gcard[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.gcard[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.gcard:disabled{cursor:default;border-style:dashed;opacity:.7}
.gcard:not(:disabled):not([aria-pressed="true"]):hover{border-color:var(--line-strong)}
.settings{border-top:1px solid var(--line)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setting.stack{flex-direction:column;align-items:stretch}
.label{font-weight:700}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:disabled{cursor:default}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.theme{border:2px solid var(--line);border-radius:10px;background:var(--felt);color:var(--felt-ink);padding:10px 12px;display:grid;gap:8px;text-align:left}
.theme[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}
.theme:disabled{cursor:default}
.theme .row{display:flex;gap:6px}
.theme .ico{width:28px;height:28px}
.rules{margin:0;padding-left:1.2em;display:grid;gap:5px;max-width:68ch}
.startrow{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;padding:16px 20px}

/* recolorable item art: the SVG's shape filled with the card's color;
   any gray shading in the art lightens that color */
.ico{position:relative;display:block;isolation:isolate}
.ico::before,.ico::after{content:"";position:absolute;inset:0}
.ico::before{background:var(--c);-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
.ico::after{background:var(--src) center/contain no-repeat;mix-blend-mode:screen}

/* emotes */
.emotebar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.emotebar .in{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.emotebar button{flex:none;width:48px;height:48px;border-radius:12px;border:1px solid transparent;background:transparent;font-size:28px;line-height:1;display:grid;place-items:center;padding:0;transition:transform .12s}
.emotebar button:hover{background:var(--hilite);border-color:var(--line)}
.emotebar button:active{transform:scale(.88)}
.emotebar button.cool{opacity:.45}
.emotebar img,.floatemote img{width:88%;height:88%;object-fit:contain;display:block}
.emotebar .in img{pointer-events:none}
.emotebar .etoggle{display:none}
.floatemote:has(img){width:84px;height:84px;margin-left:-42px}
/* phones: a button opens all the emotes in a grid above the bar */
@media (max-width:760px){
  .emotebar{flex-direction:column;align-items:stretch;gap:6px}
  .emotebar .etoggle{display:flex;align-items:center;justify-content:center;gap:8px;width:auto;height:44px;margin:0 auto;padding:0 16px 0 6px;border:1.5px solid var(--line-strong);border-radius:999px;font:700 .95rem var(--font-body);color:var(--ink)}
  .emotebar .etoggle img{width:34px;height:34px}
  .emotebar .etoggle::after{content:"▴";font-size:.8rem;color:var(--ink-soft)}
  .emotebar.open .etoggle::after{content:"▾"}
  .emotebar .in{display:none;grid-template-columns:repeat(6,1fr);gap:4px;justify-items:center;max-width:420px;margin:0 auto;overflow:visible}
  .emotebar.open .in{display:grid}
  .emotebar .in button{width:52px;height:52px}
}
.emotelayer{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.floatemote{position:absolute;width:56px;height:56px;margin-left:-28px;font-size:44px;line-height:56px;text-align:center;display:grid;place-items:center;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));animation:floatup 2.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes floatup{
  0%{transform:translateY(14px) scale(.3);opacity:0}
  14%{transform:translateY(-6px) scale(1.15);opacity:1}
  24%{transform:translateY(-10px) scale(1)}
  78%{opacity:1}
  100%{transform:translateY(-62px) scale(.95);opacity:0}
}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:9px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

@media (max-width:520px){
  .hero,.homeforms,.pad,.panel-head,.setting,.startrow,.games,.banner,.linkline{padding-inline:16px}
  .crowd{padding-inline:12px;grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
  .emotebar button{width:42px;height:42px;font-size:24px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
  .floatemote{animation-duration:1.4s}
}
</style>

<body>
<div class="shell">
  <header class="bar">
    <a class="brand" href="/" id="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#5B3FD6"/><circle cx="11" cy="12" r="3" fill="#FFD84A"/><circle cx="21" cy="12" r="3" fill="#FFD84A"/><path d="M8 19c2 4 5 6 8 6s6-2 8-6" stroke="#FFD84A" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
      <span>Game Night</span>
    </a>
    <div class="roomchip" id="roomchip"></div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <main id="main"></main>
</div>
<nav class="emotebar" id="emotebar" aria-label="Emotes" hidden><button type="button" class="etoggle" id="emoteToggle" data-act="emote-toggle" aria-expanded="false" aria-controls="emoteIn">Emotes</button><div class="in" id="emoteIn"></div></nav>
<div class="emotelayer" id="emotelayer" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/hub.js"></script>
<script src="/games/fifth-element/client.js"></script>
<script src="/games/bw11/client.js"></script>
<script src="/games/spellbound/client.js"></script>
<script src="/games/t7/client.js"></script>
